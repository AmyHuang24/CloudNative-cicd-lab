name: CI R14922174

on:
  push:
    branches:
      - '**'

permissions:
  contents: read
  checks: write

concurrency:
  group: ci-r14922174-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Typecheck, Format, and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Prettier check
        run: >
          npx prettier --check
          "src/**/*.ts"
          "test/**/*.ts"
          "vitest.config.ts"
          "tsconfig.json"
          "package.json"
          ".github/workflows/ci_R14922174.yaml"

      - name: Run tests with JUnit report
        run: |
          mkdir -p reports
          npm test -- --reporter=default --reporter=junit --outputFile.junit=reports/vitest-junit.xml

      - name: Publish test report
        if: ${{ always() && hashFiles('reports/vitest-junit.xml') != '' }}
        uses: dorny/test-reporter@v1
        with:
          name: Vitest Test Results
          path: reports/vitest-junit.xml
          reporter: java-junit
          fail-on-error: false

      - name: Upload test report artifact
        if: ${{ always() && hashFiles('reports/vitest-junit.xml') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: vitest-test-report
          path: reports/vitest-junit.xml
          if-no-files-found: error
